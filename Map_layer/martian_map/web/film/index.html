<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marsouine demo film (30 s)</title>
<style>
  :root { --bg: #050507; --ui: rgba(14, 16, 22, .92); --line: #2a2d36; --text: #e8e9ee; --dim: #9aa0ad; --accent: #36e0ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0 0 64px 0; display: grid; place-items: center; }
  body.noui #stage { inset: 0; }
  #out { display: block; background: #000; box-shadow: 0 0 0 1px #1b1d24; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--ui); border-top: 1px solid var(--line); box-sizing: border-box; }
  body.noui #ui { display: none; }
  #ui button { background: #1d2029; color: var(--text); border: 1px solid #343846; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  #ui button:hover { border-color: var(--accent); }
  #ui button:disabled { opacity: .45; cursor: default; }
  #play { width: 44px; font-size: 16px !important; }
  #scrub { flex: 1; min-width: 120px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; color: var(--dim); }
  #shot { min-width: 150px; color: var(--accent); font-weight: 600; }
  #msg { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ui); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; display: none; max-width: 80vw; z-index: 5; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--dim); font-size: 16px; z-index: 9; text-align: center; padding: 24px; }
  @media (max-width: 760px) { #shot, #saveBtn { display: none; } #ui { gap: 6px; padding: 0 8px; } #ui button { padding: 6px 8px; } }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
<div id="ui">
  <button id="play" title="Play / pause (Space)">▶</button>
  <input id="scrub" type="range" min="0" max="30" step="0.001" value="0" aria-label="Time">
  <span id="time">0.00 / 30 s</span>
  <span id="shot"></span>
  <button id="mp4Btn" title="Renders every frame, then saves an MP4 (H.264). Needs Chrome or Edge and the mp4-muxer library from cdn.jsdelivr.net.">Export MP4</button>
  <button id="webmBtn" title="Plays the film once in real time and records it (WebM). Use it if MP4 export is not available.">Record WebM</button>
  <button id="saveBtn" title="Save this frame as a PNG">Save frame</button>
</div>
<div id="msg"></div>
<div id="loading">Loading the film…</div>

<script type="module">
// Marsouine: 30 s demo film. Every picture is a pure function of the time t (seconds), so the MP4 export is frame-exact.
// All facts on screen are read from the data files at run time (layers.json, data/combined_report.json, overlays.json,
// walk/walk.json, film/assets/facts.json). Display choices (timings, camera paths, colours, height x2) are docs/ASSUMPTIONS.md A48-A53.
import * as THREE from 'three';
import {LineSegments2} from 'three/addons/lines/LineSegments2.js';
import {LineSegmentsGeometry} from 'three/addons/lines/LineSegmentsGeometry.js';

import * as SEC from '../lib/sections.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, DUR = 30;
const FPS = [24, 25, 30, 50, 60].includes(+Q.get('fps')) ? +Q.get('fps') : 30;
const SS = Math.min(2, Math.max(1, +Q.get('ss') || 1));          // supersampling of the 3D picture (1 = off)

const fail = e => { $('#loading').textContent = 'Could not load: ' + (e.message || e) + '. Serve the web/ folder (see README) and open /film/.'; throw e; };
const J = p => fetch(p).then(r => { if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); });

// ---------------------------------------------------------------- data (read, never typed in)
const manifest = await J('../layers.json').catch(fail);
const [meta, report, OV, FACTS, CR, WALK] = await Promise.all([J('../' + manifest.terrain), J('../' + manifest.report), J('../' + manifest.overlays),
  J('assets/facts.json'), J('assets/crater.json'), J('../walk/walk.json')]).catch(fail);
const LAY = Object.fromEntries(manifest.layers.map(l => [l.id, l]));
const F = SEC.makeFrame(meta);
const [WM, HM] = meta.size_m, ZMIN = meta.z.min, ZMAX = meta.z.max, ZMID = (ZMIN + ZMAX) / 2;
const EX = 2;                                                      // height x2 on the map shots (display only, A49)
const FOOT = report.profiles.foot;
const pct = (v, d = 1) => (v * 100).toFixed(d);
const BOX = FOOT.box, PATH_NOGO = FOOT.curiosity_path_before_rover_rule['NO-GO'];
const TARGET = (FOOT.strictness_verdict.match(/target\s*<=\s*([\d.]+)/) || [])[1];
const LEG = OV.routes.find(r => r.profile === 'foot' && r.leg === '4718->5050');
const RP = LEG.props;
const ROUTE = LEG.xyz.map(p => [p[0], p[1], p[2]]);
const AI = FACTS.ai, DRONE = FACTS.drone;
const SECT = SEC.sectionFromPath(F, ROUTE.map(p => [p[0], p[1]]), {heading: true});
const short = s => s.split(/ \/ | \(/)[0].trim();                   // "Nazca (49th drill hole)" -> "Nazca"
const BOXKM = [(WM * F.ewGround / 1000).toFixed(1), (HM / 1000).toFixed(1)];

// ---------------------------------------------------------------- small helpers

const out = $('#out'), X = out.getContext('2d');

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / H, 10, 1e6);

// ---------------------------------------------------------------- textures
const loader = new THREE.TextureLoader();
const tex = async (src, nearest = false, srgb = false) => {
  const t = await loader.loadAsync(src);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;     // map sheets: raw bytes in, raw out
  if (nearest) { t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }

};
const layerTex = async id => { const L = LAY[id], t = await tex('../' + L.file, !!L.nearest);
  return {t, st: new THREE.Vector4(WM / L.covers_m[0], HM / L.covers_m[1], 0, 1 - HM / L.covers_m[1]), faint: id === 'conv_terrain' || id === 'conv_groundtruth'}; };
const plain = t => ({t, st: new THREE.Vector4(1, 1, 0, 0), faint: false});
const bareT = new THREE.DataTexture(new Uint8Array([172, 164, 154, 255]), 1, 1); bareT.needsUpdate = true;
const [T_nat, T_col, T_photo, T_slope, T_rough, T_terr, T_gt, aiImg] = await Promise.all([
  tex('../walk/' + WALK.color.overview).then(plain), layerTex('combined_over_photo_foot'), layerTex('photo'),
  layerTex('conv_slope_foot'), layerTex('conv_roughness'), layerTex('conv_terrain'), layerTex('conv_groundtruth'),
  new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = 'assets/' + AI.stop.photo; })]).catch(fail);
const T_bare = plain(bareT);

// ---------------------------------------------------------------- the box heights (4 m) and the crater (MOLA-HRSC)
const hm = meta.heightmaps.find(h => h.file === 'height_4m.bin');
const HTS = new Float32Array(await (await fetch('../terrain/' + hm.file)).arrayBuffer());
const CW = WM / hm.cols, CH = HM / hm.rows;
function hAt(x, y) {                                                // bilinear on the 4 m heightmap (row 0 = north)
  const c = clamp(x / CW - .5, 0, hm.cols - 1), r = clamp((HM - y) / CH - .5, 0, hm.rows - 1);
  const c0 = Math.floor(c), r0 = Math.floor(r), c1 = Math.min(c0 + 1, hm.cols - 1), r1 = Math.min(r0 + 1, hm.rows - 1), fc = c - c0, fr = r - r0, G = (a, b) => HTS[a * hm.cols + b];
  return (G(r0, c0) * (1 - fc) + G(r0, c1) * fc) * (1 - fr) + (G(r1, c0) * (1 - fc) + G(r1, c1) * fc) * fr;
}
const CRZ = new Float32Array(await (await fetch('assets/' + CR.file)).arrayBuffer());

// ---------------------------------------------------------------- crater mesh
const SKY_H = rgb(WALK.sky.horizon_srgb), GROUND = rgb(WALK.color.far_ground_srgb);
const crater = (() => {
  const n = CR.cols, m = CR.rows, pos = new Float32Array(n * m * 3), loc = new Float32Array(n * m * 2), idx = [];
  for (let r = 0; r < m; r++) for (let c = 0; c < n; c++) {
    const k = r * n + c, p = P3(CR.x_m[c], CR.y_m[r], CRZ[k]);
    pos.set([p.x, p.y, p.z], k * 3); loc.set([CR.x_m[c], CR.y_m[r]], k * 2);
  }
  for (let r = 0; r < m - 1; r++) for (let c = 0; c < n - 1; c++) { const a = r * n + c; idx.push(a, a + n, a + 1, a + 1, a + n, a + n + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('loc', new THREE.BufferAttribute(loc, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.ShaderMaterial({transparent: true,
    uniforms: {col: {value: GROUND}, haze: {value: SKY_H}, hazeK: {value: 1 / 520000}, opacity: {value: 1}, sunDir: {value: new THREE.Vector3(-.55, .62, .2).normalize()},
      box: {value: new THREE.Vector4(0, 0, WM, HM)}, hideBox: {value: 0}},
    vertexShader: `attribute vec2 loc; varying vec2 vL; varying vec3 vN; varying float vD;
      void main() { vL = loc; vN = normal; vec4 mv = modelViewMatrix * vec4(position, 1.0); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 col, haze, sunDir; uniform float hazeK, opacity, hideBox; uniform vec4 box; varying vec2 vL; varying vec3 vN; varying float vD;
      void main() {
        if (hideBox > 0.5 && vL.x > box.x && vL.y > box.y && vL.x < box.z && vL.y < box.w) discard;
        float l = max(dot(normalize(vN), sunDir), 0.0);
        vec3 c = col * (0.22 + 0.95 * l);
        c = mix(c, haze * 0.8, 1.0 - exp(-vD * hazeK));
        gl_FragColor = vec4(c, opacity); }`});
  const mesh = new THREE.Mesh(g, mat); mesh.frustumCulled = false; mesh.renderOrder = 0; scene.add(mesh);
  return mesh;
})();

// ---------------------------------------------------------------- map sheets (the explode page's sheet, plus a wipe and a section cut)
const hTex = new THREE.DataTexture(HTS, hm.cols, hm.rows, THREE.RedFormat, THREE.FloatType);
hTex.minFilter = hTex.magFilter = THREE.NearestFilter; hTex.needsUpdate = true;
function makeGrid(nc, nr) {
  const n = nc * nr, pos = new Float32Array(n * 3), uv = new Float32Array(n * 2), guv = new Float32Array(n * 2), idx = new Uint32Array((nc - 1) * (nr - 1) * 6);
  for (let r = 0, i = 0; r < nr; r++) for (let c = 0; c < nc; c++, i++) {
    const fx = (.5 + c * (hm.cols - 1) / (nc - 1)) / hm.cols, fy = (.5 + r * (hm.rows - 1) / (nr - 1)) / hm.rows;
    pos[i * 3] = fx * WM - WM / 2; pos[i * 3 + 2] = fy * HM - HM / 2;
    uv[i * 2] = fx; uv[i * 2 + 1] = 1 - fy; guv[i * 2] = c / (nc - 1); guv[i * 2 + 1] = r / (nr - 1);
  }
  for (let r = 0, k = 0; r < nr - 1; r++) for (let c = 0; c < nc - 1; c++) { const a = r * nc + c, b = a + 1, d = a + nc, e = d + 1; idx.set([a, d, b, b, d, e], k); k += 6; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('guv', new THREE.BufferAttribute(guv, 2)); g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
function makeSkirt() {
  const P = [], UV = [], B = [], SH = [], I = [], C1 = hm.cols - 1, R1 = hm.rows - 1;
  const sides = [[[0, 0], [1, 0], .62], [[C1, 0], [0, 1], .95], [[C1, R1], [-1, 0], 1.0], [[0, R1], [0, -1], .7]];
  for (const [[c0, r0], [dc, dr], shade] of sides) {
    const n = dc ? hm.cols : hm.rows, base = P.length / 3;
    for (let k = 0; k < n; k++) {
      const c = c0 + dc * k, r = r0 + dr * k, fx = (c + .5) / hm.cols, fy = (r + .5) / hm.rows;
      for (const b of [0, 1]) { P.push(fx * WM - WM / 2, 0, fy * HM - HM / 2); UV.push(fx, 1 - fy); B.push(b); SH.push(shade); }
      if (k) { const a = base + (k - 1) * 2; I.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  g.setAttribute('bottom', new THREE.Float32BufferAttribute(B, 1)); g.setAttribute('side', new THREE.Float32BufferAttribute(SH, 1)); g.setIndex(I);
  return g;
}
const COMMON = `uniform sampler2D hTex; uniform vec2 hTexel, cell; uniform float zmid, zmin, exag, flatten, baseY;
float Hs(vec2 p) { return texture2D(hTex, vec2(p.x, 1.0 - p.y)).r; }`;
const SHEET_VS = COMMON + `
attribute vec2 guv; uniform vec3 sunDir; uniform float lit;
varying vec2 vUv; varying vec2 vG; varying float vShade;
void main() {
  float k = exag * (1.0 - flatten);
  vec3 p = position; p.y = baseY + (Hs(uv) - zmid) * k;
  float hl = Hs(uv - vec2(hTexel.x, 0.0)), hr = Hs(uv + vec2(hTexel.x, 0.0)), hn = Hs(uv + vec2(0.0, hTexel.y)), hs = Hs(uv - vec2(0.0, hTexel.y));
  vec3 n = normalize(vec3(-(hr - hl) * k / (2.0 * cell.x), 1.0, -(hs - hn) * k / (2.0 * cell.y)));
  vShade = mix(1.0, 0.3 + 0.95 * max(dot(n, sunDir), 0.0), lit * (1.0 - flatten));
  vUv = uv; vG = guv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const SHEET_FS = `
uniform sampler2D mapA, mapB; uniform vec4 stA, stB, wipe, clip; uniform vec2 box, clipRot; uniform vec3 glowCol, edgeColor;
uniform float mixAB, faintA, faintB, opacity, edgeW, clipMode, dimOut, holeDark;
varying vec2 vUv; varying vec2 vG; varying float vShade;
vec4 tap(sampler2D m, vec4 st, float faint) {
  vec4 c = texture2D(m, vUv * st.xy + st.zw);
  vec3 d = abs(c.rgb - vec3(0.6196));                              // UNKNOWN grey (158,158,158) shown faint, as on the explode page
  if (faint > 0.5 && max(d.r, max(d.g, d.b)) < 0.03) c.a *= 0.1;
  return c;
}
void main() {
  vec2 L = vec2(vUv.x * box.x, vUv.y * box.y);                      // local metres: x east, y north
  float inside = 1.0;
  if (clipMode > 0.5) {
    vec2 d = L - clip.xy; float u = d.x * clipRot.x - d.y * clipRot.y, v = d.x * clipRot.y + d.y * clipRot.x;
    inside = step(abs(u), clip.z) * step(abs(v), clip.w);
    if (clipMode < 1.5 && inside < 0.5) discard;
  }
  float s = dot(L, wipe.xy);
  float m = max(mixAB, 1.0 - smoothstep(wipe.z - wipe.w, wipe.z, s));
  vec4 c = mix(tap(mapA, stA, faintA), tap(mapB, stB, faintB), m);
  c.rgb *= vShade;

  if (clipMode > 1.5) c.rgb *= mix(1.0 - dimOut, holeDark, inside);
  vec2 e2 = min(vG, 1.0 - vG) / max(fwidth(vG), vec2(1e-6));
  c = mix(c, vec4(edgeColor, 1.0), (1.0 - smoothstep(0.7, 1.7, min(e2.x, e2.y))) * edgeW);

const SKIRT_VS = COMMON + `
attribute float bottom; attribute float side; uniform float skirt; varying float vS;
void main() {
  float k = exag * (1.0 - flatten); vec3 p = position;
  p.y = bottom > 0.5 ? baseY - (zmid - zmin) * k - skirt : baseY + (Hs(uv) - zmid) * k;
  vS = side; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);

const SKIRT_FS = `uniform vec3 color; uniform float opacity; varying float vS; void main() { gl_FragColor = vec4(color * vS, opacity); }`;
const SUN_DAY = new THREE.Vector3(-.5, .7071, -.5).normalize();
const U = {hTex: {value: hTex}, hTexel: {value: new THREE.Vector2(1 / hm.cols, 1 / hm.rows)}, cell: {value: new THREE.Vector2(CW, CH)},
  zmid: {value: ZMID}, zmin: {value: ZMIN}, sunDir: {value: SUN_DAY.clone()}, box: {value: new THREE.Vector2(WM, HM)},
  glowCol: {value: new THREE.Color(.55, .9, 1)}, edgeColor: {value: new THREE.Color(.92, .93, .96)}};

  return new THREE.ShaderMaterial({vertexShader: SHEET_VS, fragmentShader: SHEET_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: {...U, exag: {value: EX}, flatten: {value: 0}, baseY: {value: 0}, lit: {value: 1}, mapA: {value: null}, mapB: {value: null},
      stA: {value: new THREE.Vector4(1, 1, 0, 0)}, stB: {value: new THREE.Vector4(1, 1, 0, 0)}, mixAB: {value: 0}, faintA: {value: 0}, faintB: {value: 0},
      opacity: {value: 1}, edgeW: {value: 0}, wipe: {value: new THREE.Vector4(1, 0, -1e9, 1)}, clip: {value: new THREE.Vector4()}, clipRot: {value: new THREE.Vector2(1, 0)},

// the stack, bottom -> top. Titles come from layers.json; only the short role lines are ours.
const DEFS = [
  {key: 'bare', relief: true, own: T_bare, title: 'Bare terrain', src: 'USGS 1 m DEM · Layer 2'},
  {key: 'photo', relief: true, own: T_photo, title: LAY.photo.title.replace(/ \(Layer 1\)/, ''), src: 'USGS 25 cm orthophoto · Layer 1'},
  {key: 'slope', own: T_slope, title: LAY.conv_slope_foot.title.replace(' - ', ' · '), src: 'from the 1 m DEM · Layer 2'},
  {key: 'rough', own: T_rough, title: LAY.conv_roughness.title, src: 'from the 1 m DEM · Layer 2'},
  {key: 'terrain', own: T_terr, title: LAY.conv_terrain.title, src: 'geology · Layer 3'},
  {key: 'gt', own: T_gt, title: LAY.conv_groundtruth.title, src: 'Curiosity + AI stops · Layers 4, 5'},

const sheets = DEFS.map((d, i) => {
  const mat = sheetMat(); const mesh = new THREE.Mesh(d.relief ? gridRelief : gridFlat, mat);
  mesh.frustumCulled = false; mesh.renderOrder = 10 + i; scene.add(mesh);
  return {...d, i, mat, mesh};
});
const skirt = new THREE.Mesh(makeSkirt(), new THREE.ShaderMaterial({vertexShader: SKIRT_VS, fragmentShader: SKIRT_FS, transparent: true, side: THREE.DoubleSide,
  uniforms: {...U, exag: {value: EX}, flatten: {value: 0}, baseY: {value: 0}, skirt: {value: 30}, color: {value: new THREE.Color(.36, .29, .25)}, opacity: {value: 1}}}));
skirt.frustumCulled = false; skirt.renderOrder = 9; scene.add(skirt);
const setTex = (m, slot, T) => { m.uniforms['map' + slot].value = T.t; m.uniforms['st' + slot].value = T.st; m.uniforms['faint' + slot].value = T.faint ? 1 : 0; };

// the route's section (sections.js), lifted out of the map on the tablet
const secMat = sheetMat({clipMode: {value: 1}}); setTex(secMat, 'A', T_col); setTex(secMat, 'B', T_col);
const secR = SECT.rot * Math.PI / 180;
for (const m of [secMat, sheets[0].mat]) { m.uniforms.clip.value.set(SECT.cx, SECT.cy, SECT.w / 2, SECT.h / 2); m.uniforms.clipRot.value.set(Math.cos(secR), Math.sin(secR)); }
const secMesh = new THREE.Mesh(gridRelief, secMat); secMesh.frustumCulled = false; secMesh.renderOrder = 30; scene.add(secMesh);
const secGroup = new THREE.Group(); scene.add(secGroup);
const secZmin = (() => { let z = Infinity; const b = SEC.bounds(SECT); for (let y = b.y0; y <= b.y1; y += 4) for (let x = b.x0; x <= b.x1; x += 4) if (SEC.contains(SECT, x, y)) z = Math.min(z, hAt(x, y)); return z; })();
const secWalls = (() => {                                            // side walls of the lifted piece, sampled every 4 m along its edges

function renderGL(R, sc = scene, camera = cam) {

const LW = new Map([[pathGlow, 13], [pathCore, 3.2], [routeGlow, 11], [routeCore, 4.5], [droneLines, 5]]);

function drawFrame(t) {

    }
    source(t, 7.1, 8.6, 'Team GO/NO-GO rules on USGS heights, geology, the rover path and AI stops · data/combined_report.json');
  }
  // ---- 8.5-15: layers, AI, drone, slam
  if (t >= 8.5 && t < 15.0) {
    const labA = 1 - seg(t, T_SLAM - .1, T_SLAM + .2);
    for (const s of sheets) {                                        // name tags on each sheet, at its right-most corner
      const a = seg(t, T_SEP(s.i) + .35, T_SEP(s.i) + .75, eout) * labA * (t > 9.95 && t < 13.4 ? (s.key === 'gt' ? 1 : .32) : 1);
      if (a <= 0) continue;
      const by = s.mat.uniforms.baseY.value + (s.relief ? (ZMAX - ZMID) * s.mat.uniforms.exag.value * .35 : 0);
      const C = [[0, 0], [WM, 0], [WM, HM], [0, HM]].map(([x, y]) => project(new THREE.Vector3(x - WM / 2, by, (HM - y) - HM / 2), FULL));
      const [cx, cy] = C.reduce((m, c) => c[0] > m[0] ? c : m);
      const lx = Math.min(cx + 70, W - 470);
      X.save(); X.globalAlpha = a; X.beginPath(); X.arc(cx, cy, 5, 0, 7); X.fillStyle = '#fff'; X.fill();
      X.beginPath(); X.moveTo(cx + 8, cy); X.lineTo(lx - 10, cy); X.lineWidth = 1.5; X.strokeStyle = 'rgba(255,255,255,.6)'; X.stroke(); X.restore();
      txt(s.title, lx, cy - 4, 25, 700, '#fff', a, {blur: 10}); txt(s.src, lx, cy + 22, 18, 500, 'rgba(255,255,255,.72)', a, {blur: 8});
    }
    block(t, 8.65, 9.95, {x: L, y: 170, kicker: 'HOW IT IS MADE', title: 'Layer by layer', sub: 'Heights, photo, slope, roughness,\ngeology, ground truth'});
    // AI: the stop on the ground-truth sheet and Curiosity's own photo, read by the team AI
    if (t > 9.9 && t < 11.95) {
      const a = win(t, 10.0, 11.85, .35, .3), gy = sheets[N - 1].mat.uniforms.baseY.value;
      const [sx, sy] = project(stopV(gy), FULL), pulse = (t * 2) % 1;
      X.save(); X.globalAlpha = a; X.beginPath(); X.arc(sx, sy, 8 + 26 * pulse, 0, 7); X.lineWidth = 3; X.strokeStyle = `rgba(255,255,255,${1 - pulse})`; X.stroke();
      X.beginPath(); X.arc(sx, sy, 7, 0, 7); X.fillStyle = '#fff'; X.fill();
      const kx = seg(t, 10.05, 10.55, eout), cw = 520, ch = 520 + 118, cx = W - 110 - cw + 80 * (1 - kx), cy = 150;
      X.beginPath(); X.moveTo(sx + 10, sy); X.lineTo(cx - 8, cy + 170); X.lineWidth = 1.6; X.strokeStyle = 'rgba(255,255,255,.65)'; X.stroke();
      X.shadowColor = 'rgba(0,0,0,.6)'; X.shadowBlur = 40; X.beginPath(); X.roundRect(cx - 14, cy - 14, cw + 28, ch + 28, 18); X.fillStyle = 'rgba(14,16,22,.9)'; X.fill(); X.shadowColor = 'transparent';
      X.save(); X.beginPath(); X.roundRect(cx, cy, cw, cw, 10); X.clip(); X.drawImage(aiImg, 0, 0, aiImg.width, aiImg.height, cx, cy, cw, cw); X.restore();
      X.restore();
      txt(`Curiosity Navcam · sol ${AI.stop.sol}`, cx + 2, cy + cw + 38, 22, 700, '#fff', a, {shadow: false});
      let x = cx + 2; for (const [k2, c] of Object.entries(AI.overlay_colours)) { if (k2 === 'bedrock') continue; x += pill(x, cy + cw + 82, k2 === 'sand' ? `sand ${Math.round(AI.stop.sand * 100)} %` : k2, {dot: `rgb(${c.join(',')})`, size: 18, alpha: a, padX: 12}) + 10; }
      block(t, 10.0, 11.85, {x: L, y: 170, kicker: 'AI', title: "AI reads Curiosity's\nown photos", sub: `Sand found with IoU ${AI.iou.sand.toFixed(3)}\n(AI4Mars expert test set)`});
      source(t, 10.0, 11.9, `Photo: NASA/JPL-Caltech (Navcam ${AI.stop.photo_id}) · colours: team AI · scores: Ai_model/results/metrics.json`);
    }
    if (t > 11.7 && t < 13.5) {
      const yb = block(t, 11.8, 13.4, {x: L, y: 170, kicker: 'SCOUT DRONE', sim: true, title: 'A drone checks ahead', sub: `${DRONE.landed} of ${DRONE.flights} safe landings · ${DRONE.map_error_cm} cm median\nmap error, flights on Curiosity's real route`});
      // legend
      let x = L; const a = win(t, 12.1, 13.4, .3, .25); for (const [k2, lab] of [['clear', 'clear'], ['slope_caution', 'steep'], ['obstacle', 'obstacle'], ['sand', 'sand']]) x += pill(x, (yb || 400) + 34, lab, {dot: `rgb(${HZ[k2].map(v => Math.round(v * 255)).join(',')})`, size: 18, alpha: a, padX: 12}) + 10;
      source(t, 11.8, 13.45, 'Team drone simulator: simulated flights over the USGS 1 m DEM · Drone/sim/results/verify_latest.md');
    }
    // slam
    const a = win(t, 13.95, 14.98, .12, .3);
    if (a > 0) {
      const k = seg(t, 13.95, 14.25, backOut);
      X.save(); X.translate(W / 2, 470); X.scale(lerp(1.25, 1, k), lerp(1.25, 1, k));
      txt('Worst layer wins', 0, 0, 104, 900, '#fff', a, {align: 'center', ls: -1, blur: 26}); X.restore();
      txt("Each 3 m cell takes the strictest of slope, roughness and terrain unit", W / 2, 545, 28, 500, 'rgba(240,242,246,.92)', a * seg(t, 14.1, 14.4), {align: 'center'});
    }
  }
  // ---- 15-18: tested on Curiosity's path
  if (t >= 15.0 && t < 18.0) {
    const k = seg(t, 15.25, 16.3, eout), a = win(t, 15.2, 17.95, .3, .3);
    txt("TESTED ON CURIOSITY'S REAL PATH", L, BOT - 214, 22, 700, COL.accent, a, {ls: 5});
    const num = (PATH_NOGO * 100 * k).toFixed(1);

    txt('% NO-GO', L + w + 14, BOT - 76, 56, 800, COL['NO-GO'], a, {blur: 20});
    txt(`Curiosity drove it; our map marks only ${pct(PATH_NOGO)} % of it NO-GO`, L, BOT - 14, 28, 500, 'rgba(240,242,246,.92)', a * seg(t, 15.5, 16));
    txt(`(checked before the map uses the rover's own track${TARGET ? `; target ≤ ${TARGET} %` : ''})`, L, BOT + 24, 22, 500, 'rgba(240,242,246,.7)', a * seg(t, 15.6, 16.1));
    source(t, 15.1, 18.0, `Rover path: NASA/JPL-Caltech MSL traverse · share: data/combined_report.json (crew on foot)`);
  }
  // ---- 18-24: the tablet
  if (t >= 18.0 && t < 24.0) drawTabletUI(t, st);
  // ---- 24-26.4: the helmet
  if (ws && t < 26.95) drawHelmet(t, ws);
  // ---- 26.4-30: title

    txt('Know the ground before you step.', W / 2, y0 + 70, 40, 600, 'rgba(240,242,246,.95)', seg(t, 27.25, 27.8, eout), {align: 'center'});
    const b = seg(t, 27.9, 28.4, eout);
    txt('Team y3m  ·  NASA Space Apps Challenge 2026', W / 2, y0 + 128, 26, 600, COL.accent, b, {align: 'center', ls: 3});
    txt('Data: NASA/JPL-Caltech/MSSS · USGS Astrogeology · MOLA-HRSC (NASA, ESA/DLR/FU Berlin) · AI4Mars · Mars24 (NASA GISS)', W / 2, H - 46, 18, 500, 'rgba(255,255,255,.62)', seg(t, 28.3, 28.8), {align: 'center', blur: 8});
  }
}

  block(t, 18.2, 18.98, {x: 110, y: 430, kicker: 'THE APP', title: 'Marsouine', sub: "on the astronaut's tablet", size: 70, subSize: 26});
  const S = screenRect(st), z = st.tabZoom;

  if (a > 0) {

    // top bar

    row(TOP + 140, COL.route, 'B', short(RP.to), `sol ${RP.sol_to}`, seg(t, 19.5, 19.8));
    const kS = seg(t, 20.2, 20.6); const stats = [[`${RP.route_m} m`, 'walk'], [`${pct(RP.pct_go, 0)} % GO`, `${pct(RP.pct_caution, 0)} % caution, ${pct(RP.pct_nogo, 0)} % no-go`], [`${Math.round(RP.slope_max_deg)}°`, 'steepest slope']];
    stats.forEach(([v, l], i) => { const k = seg(t, 20.2 + i * .25, 20.6 + i * .25, eout); txt(v, tx(26), ty(TOP + 236 + i * 74), 34 * z, 800, i === 1 ? COL.GO : '#fff', A2 * k, {shadow: false}); txt(l, tx(26), ty(TOP + 262 + i * 74), 16 * z, 500, 'rgba(255,255,255,.6)', A2 * k, {shadow: false}); });
    const kc = seg(t, 21.6, 22.1, eout);
    if (kc > 0) {
      txt('SECTION ON THIS TABLET', tx(26), ty(TOP + 500), 15 * z, 700, 'rgba(255,255,255,.5)', A2 * kc, {ls: 3 * z, shadow: false});
      txt(`${(SECT.w * F.ewGround / 1000).toFixed(2)} × ${(SECT.h / 1000).toFixed(2)} km`, tx(26), ty(TOP + 540), 28 * z, 800, '#fff', A2 * kc, {shadow: false});
      txt(`${pct(SEC.share(F, SECT), 0)} % of the box · ${SEC.DEFAULTS.margin} m around the route`, tx(26), ty(TOP + 566), 15 * z, 500, 'rgba(255,255,255,.6)', A2 * kc, {shadow: false});

    const k = seg(t, t0, t0 + .45, backOut); if (k <= 0) continue;
    const [px, py] = project(P3(p[0], p[1], hAt(p[0], p[1]), lift + 12), R);
    const s = z * Math.min(1.4, Math.max(.5, k)), hgt = 46 * s;
    X.save(); X.globalAlpha = Math.min(1, k * 2) * fadeZoom; X.translate(px, py - (1 - Math.min(1, k)) * 60);
    X.beginPath(); X.ellipse(0, 0, 9 * s, 4 * s, 0, 0, 7); X.fillStyle = 'rgba(0,0,0,.45)'; X.fill();
    X.beginPath(); X.moveTo(0, 0); X.bezierCurveTo(-6 * s, -hgt * .45, -18 * s, -hgt * .55, -18 * s, -hgt * .78); X.arc(0, -hgt * .78, 18 * s, Math.PI, 0); X.bezierCurveTo(18 * s, -hgt * .55, 6 * s, -hgt * .45, 0, 0);

  block(t, 21.4, 23.3, {x: 110, y: 430, kicker: 'SECTION', title: 'See only\nyour path', sub: 'The tablet keeps just the\nground around your route', size: 70, subSize: 26});

function drawHelmet(t, ws) {
  const a = 1 - seg(t, 26.25, 26.8);
  // visor: dark rounded frame with a soft inner edge
  X.save(); X.globalAlpha = a;
  const g = X.createRadialGradient(W / 2, H * .52, H * .42, W / 2, H * .52, W * .62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.75, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,.92)');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  X.lineWidth = 2; X.strokeStyle = 'rgba(54,224,255,.35)'; X.beginPath(); X.roundRect(70, 60, W - 140, H - 120, 120); X.stroke();
  X.restore();
  const cls = ['UNKNOWN', 'GO', 'CAUTION', 'NO-GO'][ws.cls] || '–';
  const rem = Math.max(0, routeLen - ws.s), dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const hud = [['GROUND', cls, COL[cls] || '#fff'], ['TO B', `${(rem / 1000).toFixed(2)} km`, '#fff'], ['HEADING', `${Math.round(ws.head)}° ${dirs[Math.round(ws.head / 45) % 8]}`, '#fff'], ['SPEED', '×20', COL.accent]];
  hud.forEach(([k, v, c], i) => { const x = 150 + i * 230; txt(k, x, 132, 15, 700, 'rgba(255,255,255,.6)', a, {ls: 3, blur: 8}); txt(v, x, 168, 30, 800, c, a, {blur: 10}); });
  simTag(W - 150 - measure('SIMULATED WALK', 16, 700, 2.5) - 24, 128, a, 'SIMULATED WALK');
  block(t, 24.25, 26.3, {x: 150, y: BOT - 40, kicker: 'HELMET VIEW', title: 'Walk it before you go', sub: "An astronaut's eye view on the real 1 m terrain", size: 72});
  source(t, 24.2, 26.4, 'Ground: USGS 1 m DEM · colours: NASA PIA26693 · far hills: MOLA-HRSC · sun: Mars24, 09:00 local');
}

// ---------------------------------------------------------------- player
let T = clamp(+Q.get('t') || 0, 0, DUR), playing = false, last = 0;
const scrub = $('#scrub'), playB = $('#play');
function show(t) { T = t; drawFrame(t); scrub.value = t; $('#time').textContent = `${t.toFixed(2)} / ${DUR} s`; $('#shot').textContent = shotAt(t); }
function tick(now) { if (!playing) return; const dt = (now - last) / 1000; last = now; let t = T + Math.min(dt, .1);
  if (t >= DUR) { if (Q.get('loop') === '1') t = 0; else { t = DUR; setPlay(false); } } show(t); requestAnimationFrame(tick); }
function setPlay(p) { playing = p; playB.textContent = p ? '❚❚' : '▶'; if (p) { if (T >= DUR) T = 0; last = performance.now(); requestAnimationFrame(tick); } }
playB.onclick = () => setPlay(!playing);
scrub.oninput = () => { setPlay(false); show(+scrub.value); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlay(false); show(clamp(T + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS), 0, DUR)); }
  else if (e.code === 'Home') { setPlay(false); show(0); }
});
function fit() { const ui = document.body.classList.contains('noui') ? 0 : 64, s = Math.min(innerWidth / W, (innerHeight - ui) / H); out.style.width = W * s + 'px'; out.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const say = (m, ms = 0) => { const el = $('#msg'); el.textContent = m; el.style.display = m ? 'block' : 'none'; if (ms) setTimeout(() => { if (el.textContent === m) el.style.display = 'none'; }, ms); };
const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
$('#saveBtn').onclick = () => out.toBlob(b => save(b, `marsouine_film_t${T.toFixed(2)}.png`), 'image/png');
const busy = b => { for (const id of ['#mp4Btn', '#webmBtn', '#saveBtn', '#play']) $(id).disabled = b; scrub.disabled = b; };

// frame-exact MP4: WebCodecs (H.264) + mp4-muxer, loaded only when you export
const MUXER = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs';
async function exportMP4() {
  if (!('VideoEncoder' in window)) { say('This browser has no WebCodecs video encoder. Use Chrome or Edge, or "Record WebM".', 7000); return; }
  setPlay(false); busy(true);
  try {
    say('Loading the MP4 writer (mp4-muxer 5.2.2 from cdn.jsdelivr.net)…');
    const {Muxer, ArrayBufferTarget} = await import(MUXER);
    let cfg = null;
    for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.640032']) {
      const c = {codec, width: W, height: H, bitrate: 14e6, framerate: FPS, avc: {format: 'avc'}};
      if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; }
    }
    if (!cfg) throw new Error('no H.264 encoder for 1920 × 1080 here');
    const muxer = new Muxer({target: new ArrayBufferTarget(), video: {codec: 'avc', width: W, height: H, frameRate: FPS}, fastStart: 'in-memory'});
    let err = null;
    const enc = new VideoEncoder({output: (chunk, m) => muxer.addVideoChunk(chunk, m), error: e => { err = e; }});
    enc.configure(cfg);
    const n = Math.round(DUR * FPS);
    for (let i = 0; i < n; i++) {
      if (err) throw err;
      const t = i / FPS; drawFrame(t);
      const vf = new VideoFrame(out, {timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS)});
      enc.encode(vf, {keyFrame: i % (FPS * 2) === 0}); vf.close();
      if (enc.encodeQueueSize > 6) await new Promise(r => enc.addEventListener('dequeue', r, {once: true}));
      if (i % 10 === 0) { say(`Rendering frame ${i + 1} / ${n} (${FPS} fps)…`); scrub.value = t; await new Promise(r => setTimeout(r)); }
    }
    await enc.flush(); muxer.finalize();
    save(new Blob([muxer.target.buffer], {type: 'video/mp4'}), `marsouine_demo_30s_1080p${FPS}.mp4`);
    say(`Saved marsouine_demo_30s_1080p${FPS}.mp4 (${cfg.codec}, no sound: add the music in your editor).`, 9000);
  } catch (e) { console.error(e); say('MP4 export failed: ' + (e.message || e) + '. Try "Record WebM".', 9000); }
  busy(false); show(T);
}
// fallback: record in real time with MediaRecorder (WebM)
async function recordWebM() {
  if (!out.captureStream || !window.MediaRecorder) { say('This browser cannot record a canvas.', 6000); return; }
  setPlay(false); busy(true);
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const stream = out.captureStream(FPS), rec = new MediaRecorder(stream, {mimeType: type, videoBitsPerSecond: 14e6}), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  show(0); rec.start();
  const t0 = performance.now();
  await new Promise(r => { const step = () => { const t = (performance.now() - t0) / 1000; show(Math.min(t, DUR)); say(`Recording in real time… ${t.toFixed(1)} s`); if (t < DUR) requestAnimationFrame(step); else r(); }; requestAnimationFrame(step); });
  rec.stop(); await done;
  save(new Blob(parts, {type: 'video/webm'}), 'marsouine_demo_30s.webm'); say('Saved marsouine_demo_30s.webm (real-time recording: frames can drop if the computer is slow).', 9000);
  busy(false);
}
$('#mp4Btn').onclick = exportMP4; $('#webmBtn').onclick = recordWebM;

$('#loading').remove();
show(T);
if (Q.get('play') === '1') setPlay(true);
window.__film = {drawFrame, show, DUR, FPS, SHOTS, SECT, sheets, cam, walk, renderer};
