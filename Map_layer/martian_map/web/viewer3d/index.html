<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martian Map 3D</title>
<style>
:root{--bg:#0f1115;--panel:rgba(20,22,28,.92);--line:#2c3038;--text:#e8e6e3;--muted:#9aa0a6;--accent:#00dcff;
--go:#1a9850;--caution:#f4c430;--nogo:#d73027;--unknown:#9e9e9e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:fixed;inset:0}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px);max-height:calc(100vh - 24px);overflow:auto}
#left{top:12px;left:12px;width:290px}#legend{top:12px;right:12px;width:330px}#gates{bottom:12px;right:12px;width:330px}
h1{font-size:15px;margin:0 0 2px}h2{font-size:12px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:12px;margin:0 0 6px}
label{display:flex;gap:6px;align-items:flex-start;padding:2px 0;cursor:pointer}
label.layer{padding:3px 4px;border-radius:6px}label.layer:hover{background:#ffffff10}
input[type=range]{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;background:none;border:0;color:var(--text);padding:6px;cursor:pointer;font:inherit}
.seg button.on{background:#ffffff1c;font-weight:600}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid #0006}
.row{display:flex;justify-content:space-between;gap:8px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:600;font-size:11px;color:#111}
.GO{background:var(--go);color:#fff}.CAUTION{background:var(--caution)}.NO-GO{background:var(--nogo);color:#fff}.UNKNOWN{background:var(--unknown)}
.kv{color:var(--muted)}a{color:var(--accent)}
ul{margin:4px 0;padding-left:16px}li{margin:2px 0}
#banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:8px;font-weight:700;display:none;z-index:5}
#readout{position:fixed;left:12px;bottom:12px;font-variant-numeric:tabular-nums;padding:8px 10px;min-width:250px}
#info{position:fixed;left:316px;top:12px;width:320px;display:none}
.lbl{color:#fff;font-size:11px;font-weight:600;text-shadow:0 0 3px #000,0 0 6px #000;white-space:nowrap;pointer-events:none;transform:translateY(-14px)}
.leg{font-size:12px;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.num{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:999px;color:#111;font-weight:800;font-size:11px;border:1.5px solid #000;text-shadow:none;flex:none}
.pin{display:flex;gap:6px;align-items:flex-start;padding-left:14px;color:#fff;font-size:11.5px;font-weight:600;line-height:1.3;text-shadow:0 0 3px #000,0 0 6px #000,0 0 8px #000;white-space:nowrap;pointer-events:none}
.pin .s{font-weight:400;color:#ddd}.pin.left{flex-direction:row-reverse;padding-left:0;padding-right:14px;text-align:right}
.poiitem{display:flex;gap:8px;align-items:flex-start;padding:4px;border-radius:6px;cursor:pointer}.poiitem:hover{background:#ffffff10}
.ok{color:#7ee2a0}.warn{color:var(--caution)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.panel>h1:first-child{cursor:pointer;padding-right:18px;position:relative}.panel>h1:first-child::after{content:'▾';position:absolute;right:0;top:0;color:var(--muted)}
.panel.min>h1:first-child::after{content:'▸'}.panel.min>:not(h1:first-child){display:none}
@media (max-height:760px){#legend{max-height:calc(50vh - 18px)}#gates{max-height:calc(50vh - 18px)}}
@media (max-width:820px){#left{width:calc(100% - 24px);max-height:38vh}#legend{display:none}#gates{width:calc(100% - 24px);max-height:30vh}#info{left:12px;top:auto;bottom:70px;width:calc(100% - 24px);max-height:36vh}#readout{display:none}}
.panel{z-index:2}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="loading">Loading terrain…</div>
<div id="banner"></div>
<aside id="left" class="panel">
  <h1>Martian Map: Mount Sharp boxwork</h1>
  <p class="sub">Gale crater, 137.36–137.40°E, 4.78–4.83°S. Every colour is a rule with a source; see the right panel.</p>
  <div id="secbar" class="leg" style="display:none"></div>
  <h2>Who is going?</h2>
  <div class="seg" id="profile"><button data-p="foot" class="on">Crew on foot</button><button data-p="rover">Rover</button></div>
  <h2>Map on the terrain</h2><div id="layers"></div>
  <h2>Show</h2>
  <label><input type="checkbox" id="tRoutes" checked> Planned routes (cyan)</label>
  <label><input type="checkbox" id="tPath" checked> Curiosity's real path (white)</label>
  <label><input type="checkbox" id="tPois" checked> Points of interest (Layer 5, numbered pins)</label>
  <label><input type="checkbox" id="tEva"> EVA stops, team AI colour (Layer 5)</label>
  <label><input type="checkbox" id="tHQ"> High-detail terrain (2 m)</label>
  <h2>Points of interest (Layer 5)</h2><div id="poilist"></div>
  <h2>Vertical exaggeration <span id="exv"></span></h2>
  <input type="range" id="exag" min="1" max="5" step="0.5">
  <h2>Routes</h2><div id="routes"></div>
  <h2>Strictness check</h2><div id="check"></div>
</aside>
<aside id="legend" class="panel"></aside>
<aside id="gates" class="panel"></aside>
<aside id="info" class="panel"></aside>
<div id="readout" class="panel">Move over the terrain</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import * as SEC from '../lib/sections.js';

const BASE = '../';
const J = async p => { const r = await fetch(BASE + p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); };
const $ = s => document.querySelector(s);
const manifest = await J('layers.json');
const [meta, ov, gates, report] = await Promise.all([J(manifest.terrain), J(manifest.overlays), J(manifest.gates), J(manifest.report)]);
const [WM, HM] = meta.size_m, ZMIN = meta.z.min;
const CLS = {GO: 1, CAUTION: 2, 'NO-GO': 3, UNKNOWN: 0};
const CATS = ov.poi_categories;   // POI category -> {label, color}, written by pipeline/60_web_export.py
// ?section=... (web/lib/sections.js): show only one piece of the map, cut by four vertical planes
const Qs = new URLSearchParams(location.search);
let SECT = null, secOn = false, secErr = '';
try { SECT = SEC.fromQuery(SEC.makeFrame(meta), Qs, {overlays: ov}, {profile: Qs.get('profile') === 'rover' ? 'rover' : 'foot'}); if (SECT?.kind === 'whole') SECT = null; secOn = !!SECT; }
catch (e) { secErr = e.message; }
let exag = meta.vertical_exaggeration.default, profile = 'foot', layerKey = 'combined_over_photo';

// ---------- renderer, scene
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; $('#app').appendChild(renderer.domElement);
const labels = new CSS2DRenderer(); labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, {position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1}); document.body.appendChild(labels.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 40000);
camera.position.set(1050, 2500, 2350);   // opening view: from the south-east, framing the route and all POI pins
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(300, 350, 420); controls.maxPolarAngle = Math.PI * 0.49; controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.6));
function sectionPlanes(sec) {                                  // keep |u| <= w/2 and |v| <= h/2 around the section centre (scene: +x east, +z south)
  const {right, up} = SEC.axes(sec), c = new THREE.Vector3(sec.cx - WM / 2, 0, HM / 2 - sec.cy);
  return [[new THREE.Vector3(right[0], 0, -right[1]), sec.w / 2], [new THREE.Vector3(up[0], 0, -up[1]), sec.h / 2]]
    .flatMap(([n, half]) => [new THREE.Plane(n.clone().negate(), c.dot(n) + half), new THREE.Plane(n.clone(), -c.dot(n) + half)]);
}
const inSection = (x, y) => !secOn || SEC.contains(SECT, x, y);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-1, 1, -1).multiplyScalar(3000); scene.add(sun); // from the NW, like the hillshade

// ---------- terrain
let H = null, hm = null, mesh = null, overlayMesh = null;
const mat = new THREE.MeshLambertMaterial({color: 0xffffff});
const ovMat = new THREE.MeshLambertMaterial({transparent: true, polygonOffset: true, polygonOffsetFactor: -2, depthWrite: false});
async function loadHeights(file) {
  hm = meta.heightmaps.find(h => h.file === file);
  H = new Float32Array(await (await fetch(BASE + 'terrain/' + file)).arrayBuffer());
  const {cols, rows} = hm, g = new THREE.BufferGeometry();
  const pos = new Float32Array(cols * rows * 3), uv = new Float32Array(cols * rows * 2), idx = new Uint32Array((cols - 1) * (rows - 1) * 6);
  for (let r = 0, i = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) {
    const x = (c + 0.5) / cols * WM, yTop = (r + 0.5) / rows * HM;
    pos[i * 3] = x - WM / 2; pos[i * 3 + 2] = yTop - HM / 2; uv[i * 2] = x / WM; uv[i * 2 + 1] = 1 - yTop / HM;
  }
  for (let r = 0, k = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const a = r * cols + c, b = a + 1, d = a + cols, e = d + 1; idx.set([a, d, b, b, d, e], k); k += 6;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(new THREE.BufferAttribute(idx, 1));
  if (mesh) { scene.remove(mesh, overlayMesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(g, mat); overlayMesh = new THREE.Mesh(g, ovMat); overlayMesh.visible = false; scene.add(mesh, overlayMesh);
  applyExag();
}
function applyExag() {
  const p = mesh.geometry.attributes.position.array;
  for (let i = 0; i < H.length; i++) p[i * 3 + 1] = (H[i] - ZMIN) * exag;
  mesh.geometry.attributes.position.needsUpdate = true; mesh.geometry.computeVertexNormals(); mesh.geometry.computeBoundingSphere();
  buildOverlays();
}
// local metres (x east of W edge, y north of S edge, z elevation) -> scene
const P3 = (x, y, z, lift = 0) => new THREE.Vector3(x - WM / 2, (z - ZMIN) * exag + lift, (HM - y) - HM / 2);
function heightAt(x, y) {   // bilinear on the loaded heightmap
  const c = x / WM * hm.cols - 0.5, r = (HM - y) / HM * hm.rows - 0.5;
  const c0 = Math.max(0, Math.min(hm.cols - 2, Math.floor(c))), r0 = Math.max(0, Math.min(hm.rows - 2, Math.floor(r)));
  const fc = Math.min(1, Math.max(0, c - c0)), fr = Math.min(1, Math.max(0, r - r0)), I = (rr, cc) => H[rr * hm.cols + cc];
  return (I(r0, c0) * (1 - fc) + I(r0, c0 + 1) * fc) * (1 - fr) + (I(r0 + 1, c0) * (1 - fc) + I(r0 + 1, c0 + 1) * fc) * fr;
}

// ---------- textures / layers
const loader = new THREE.TextureLoader(), texCache = {}, pixCache = {};
function tex(layer) {
  if (texCache[layer.id]) return texCache[layer.id];
  const t = loader.load(BASE + layer.file); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (layer.nearest) t.magFilter = THREE.NearestFilter;
  t.repeat.set(WM / layer.covers_m[0], HM / layer.covers_m[1]); t.offset.set(0, 1 - HM / layer.covers_m[1]);
  return texCache[layer.id] = t;
}
const keyOf = l => l.profile ? l.id.replace(/_(foot|rover)$/, '') : l.id;
const current = () => manifest.layers.find(l => keyOf(l) === layerKey && (!l.profile || l.profile === profile));
function showLayer() {
  const L = current(), photo = manifest.layers.find(l => l.id === 'photo');
  if (L.overlay_on_photo) { mat.map = tex(photo); ovMat.map = tex(L); overlayMesh.visible = true; }
  else { mat.map = tex(L); overlayMesh.visible = false; }
  mat.needsUpdate = ovMat.needsUpdate = true; renderLegend(L); loadPixels(L);
  document.querySelectorAll('#layers input').forEach(i => i.checked = i.value === layerKey);
}
function renderLayerMenu() {
  const groups = {}; const seen = new Set();
  for (const l of manifest.layers) { const k = keyOf(l); if (seen.has(k)) continue; seen.add(k); (groups[l.group] ??= []).push(l); }
  $('#layers').innerHTML = Object.entries(groups).map(([g, ls]) => `<div class="kv" style="margin-top:6px">${g}</div>` +
    ls.map(l => `<label class="layer"><input type="radio" name="layer" value="${keyOf(l)}"> ${l.title.replace(/ \((foot|rover|crew on foot)\)$/, '')}</label>`).join('')).join('');
  $('#layers').onchange = e => { layerKey = e.target.value; showLayer(); };
}
function fmt(v) { return typeof v === 'number' ? (v * 100).toFixed(1) + ' %' : v; }
function renderLegend(L) {
  let h = `<h1>${L.title}</h1><p class="sub">${L.parameter || ''}</p>`;
  const S = L.stats?.box || L.stats || {}, SP = L.stats?.curiosity_path;
  const look = (o, lab) => o?.[lab] ?? o?.[lab.split(' ')[0]];
  if (L.legend) h += `<div class="row kv"><span></span><span>box${SP ? ' · on Curiosity\'s path' : ''}</span></div>` +
    L.legend.map(s => `<div class="row"><span><span class="sw" style="background:${s.color}"></span>${s.label}</span><span class="kv">${look(S, s.label) !== undefined ? fmt(look(S, s.label)) : ''}${SP && look(SP, s.label) !== undefined ? ' · ' + fmt(look(SP, s.label)) : ''}</span></div>`).join('');
  else if (L.stats) h += Object.entries(S).map(([k, v]) => `<div class="row"><span>${k}</span><span class="kv">${fmt(v)}</span></div>`).join('');
  if (L.id.startsWith('reach')) h += `<p class="sub">${fmt(L.stats.reachable_share)} of the box can be reached from the base without crossing NO-GO.</p>`;
  if (L.rule) h += `<h2>Rule</h2><ul>${Object.entries(L.rule).map(([k, v]) => `<li><b>${k}</b>: ${v}</li>`).join('')}</ul>`;
  if (L.basis) h += `<h2>Basis</h2><p class="sub">${L.basis}</p>`;
  if (L.sources?.length) h += `<h2>Sources</h2><ul>${L.sources.map(s => /^https?:/.test(s) ? `<li><a href="${s}" target="_blank" rel="noopener">${new URL(s).hostname}${new URL(s).pathname.slice(0, 40)}…</a></li>` : `<li>${s}</li>`).join('')}</ul>`;
  $('#legend').innerHTML = h;
}
// read class textures back to classify the point under the mouse
function loadPixels(L) {
  if (!L.nearest || pixCache[L.id]) return;
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = () => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d');
    x.drawImage(img, 0, 0); pixCache[L.id] = {w: img.width, h: img.height, d: x.getImageData(0, 0, img.width, img.height).data}; };
  img.src = BASE + L.file;
}
const PAL = [[158, 158, 158, 'UNKNOWN'], [26, 152, 80, 'GO'], [244, 196, 48, 'CAUTION'], [215, 48, 39, 'NO-GO']];
function classAt(L, x, y) {
  const p = pixCache[L.id]; if (!p) return null;
  const c = Math.min(p.w - 1, Math.floor(x / L.covers_m[0] * p.w)), r = Math.min(p.h - 1, Math.floor((HM - y) / L.covers_m[1] * p.h));
  const i = (r * p.w + c) * 4, d = p.d; if (d[i + 3] === 0) return '—';
  let best = null, bd = 1e9; for (const q of PAL) { const dd = (q[0] - d[i]) ** 2 + (q[1] - d[i + 1]) ** 2 + (q[2] - d[i + 2]) ** 2; if (dd < bd) { bd = dd; best = q[3]; } }
  return bd < 300 ? best : null;
}

// ---------- overlays
const ovGroup = new THREE.Group(); scene.add(ovGroup);
const poiMeshes = [], pinLabels = [];
// every frame: put each POI label on the right of its pin, or on the left when the right side would cover
// another pin or a label already placed (top of the screen first)
const _v = new THREE.Vector3();
function declutter() {
  if (!pinLabels.length) return;
  const it = pinLabels.map(o => { _v.copy(o.top).project(camera);
    return {o, x: (_v.x + 1) / 2 * innerWidth, y: (1 - _v.y) / 2 * innerHeight, w: o.el.offsetWidth, h: o.el.offsetHeight}; });
  const boxes = it.map(i => ({x0: i.x - 12, x1: i.x + 12, y0: i.y - 12, y1: i.y + 12}));
  const hits = b => boxes.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  for (const i of it.sort((a, b) => a.y - b.y)) {
    const R = {x0: i.x + 13, x1: i.x + i.w, y0: i.y - i.h / 2, y1: i.y + i.h / 2}, Lf = {x0: i.x - i.w, x1: i.x - 13, y0: R.y0, y1: R.y1};
    const left = hits(R) && !hits(Lf);
    if (left !== i.o.left) { i.o.left = left; i.o.el.classList.toggle('left', left); i.o.lb.center.set(left ? 1 : 0, 0.5); }
    boxes.push(left ? Lf : R);
  }
}
function buildOverlays() {
  ovGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.element) o.element.remove(); });
  ovGroup.clear(); poiMeshes.length = 0; pinLabels.length = 0;
  if ($('#tRoutes').checked) for (const r of ov.routes.filter(r => r.profile === profile)) {
    const pts = r.xyz.map(p => P3(p[0], p[1], p[2], 2.5));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
    ovGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, pts.length * 2), 2.2, 6, false), new THREE.MeshBasicMaterial({color: 0x00dcff})));
  }
  if ($('#tPath').checked) for (const seg of ov.curiosity_path) {
    const g = new THREE.BufferGeometry().setFromPoints(seg.map(p => P3(p[0], p[1], p[2], 1.2)));
    ovGroup.add(new THREE.Line(g, new THREE.LineBasicMaterial({color: 0xffffff})));
  }
  // Layer 5 POIs: one numbered pin per site (POIs closer than 25 m share a pin), coloured by category,
  // with a ring draped on the terrain that marks the exact spot
  if ($('#tPois').checked) for (const s of ov.poi_sites) {
    if (!inSection(s.x, s.y)) continue;
    const col = CATS[s.category].color, base = s.category === 'rover_position', zg = heightAt(s.x, s.y);
    const ground = P3(s.x, s.y, zg, 0), top = P3(s.x, s.y, zg, 75), len = top.y - ground.y;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, len, 8), new THREE.MeshBasicMaterial({color: col}));
    stem.position.set(ground.x, ground.y + len / 2, ground.z); ovGroup.add(stem);
    const head = new THREE.Mesh(new THREE.SphereGeometry(base ? 12 : 10, 24, 16), new THREE.MeshBasicMaterial({color: col}));
    head.position.copy(top); head.userData = {site: s}; ovGroup.add(head); poiMeshes.push(head);
    const R = Math.max(18, s.spread_m + 12), ring = [];
    for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2, x = s.x + R * Math.cos(a), y = s.y + R * Math.sin(a); ring.push(P3(x, y, heightAt(x, y), 1.5)); }
    ovGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ring, true), 96, 1.6, 6, true), new THREE.MeshBasicMaterial({color: col})));
    const el = document.createElement('div'); el.className = 'pin';
    el.innerHTML = `<span class="num" style="background:${col}">${s.site}</span><span>${base ? 'BASE: ' : ''}${s.names.join('<br>')}<br><span class="s">${s.sol_label}</span></span>`;
    const lb = new CSS2DObject(el); lb.center.set(0, 0.5); lb.position.copy(top); ovGroup.add(lb);
    pinLabels.push({top, el, lb, left: false});
  }
  if ($('#tEva').checked) for (const e of ov.eva_stops) {
    if (!inSection(e.x, e.y)) continue;
    const s = new THREE.Mesh(new THREE.SphereGeometry(3.5, 10, 8), new THREE.MeshBasicMaterial({color: {red: 0xd73027, orange: 0xff9e3d, green: 0x7ee2a0}[e.team_class]}));
    s.position.copy(P3(e.x, e.y, e.z, 4)); s.userData = {eva: e}; ovGroup.add(s); poiMeshes.push(s);
  }
}

// ---------- POI list, info card, fly-to
function renderPoiList() {
  const used = [...new Set(ov.poi_sites.map(s => s.category))];
  $('#poilist').innerHTML = ov.poi_sites.map(s => `<div class="poiitem" data-site="${s.site}"><span class="num" style="background:${CATS[s.category].color}">${s.site}</span>
      <span>${s.names.join(', ')}<br><span class="kv">${s.sol_label} · ${CATS[s.category].label}</span></span></div>`).join('') +
    `<div class="sub" style="margin-top:6px">${used.map(c => `<span class="sw" style="background:${CATS[c].color}"></span>${CATS[c].label}`).join('<br>')}</div>
    <p class="sub">POIs closer than 25 m share one pin. Click a row or a pin for the details and NASA sources.</p>`;
  $('#poilist').onclick = e => { const it = e.target.closest('.poiitem'); if (it) focusSite(ov.poi_sites.find(s => s.site === +it.dataset.site)); };
}
function siteCard(s) {
  const box = $('#info'); box.style.display = 'block';
  const ps = s.poi_ids.map(id => ov.pois.find(p => p.poi_id === id));
  box.innerHTML = `<h1><span class="num" style="background:${CATS[s.category].color}">${s.site}</span> ${s.names.join(' · ')}</h1>
    <p class="sub">${CATS[s.category].label} · ${s.sol_label}${ps.length > 1 ? ` · ${ps.length} POIs within ${Math.ceil(s.spread_m)} m share this pin` : ''}</p>` +
    ps.map(p => `<div class="leg"><b>${p.name}</b> <span class="kv">sol ${p.sol} · ${p.category.replace('_', ' ')} · ${p.evidence}</span>
      <p style="margin:3px 0">${p.description || ''}</p><p class="kv" style="margin:3px 0">${p.science_value || ''}</p>
      ${p.source_url ? `<a href="${p.source_url}" target="_blank" rel="noopener">Source</a>` : ''}</div>`).join('');
}
let fly = null;
function focusSite(s) {
  const t = P3(s.x, s.y, heightAt(s.x, s.y), 0), dir = camera.position.clone().sub(controls.target).normalize();
  fly = {t0: performance.now(), fT: controls.target.clone(), tT: t, fP: camera.position.clone(), tP: t.clone().add(dir.multiplyScalar(750))};
  siteCard(s);
}
function stepFly(now) {
  if (!fly) return; const k = Math.min(1, (now - fly.t0) / 900), e = k * k * (3 - 2 * k);
  controls.target.lerpVectors(fly.fT, fly.tT, e); camera.position.lerpVectors(fly.fP, fly.tP, e); if (k === 1) fly = null;
}

// ---------- side panels: routes + strictness check
function renderRoutes() {
  const legs = report.profiles[profile].legs;
  $('#routes').innerHTML = legs.map(l => `<div class="leg"><b>sol ${l.sol_from} → ${l.sol_to}</b>: ${l.route_m} m <span class="kv">(straight ${l.straight_m} m; Curiosity ≥ ${l.curiosity_waypoint_chain_m} m)</span><br>
    <span class="chip GO">${Math.round(l.classes_on_route.GO * 100)} % GO</span> <span class="chip CAUTION">${Math.round(l.classes_on_route.CAUTION * 100)} %</span> <span class="kv">max slope ${l.slope_max_deg}°</span></div>`).join('') +
    `<p class="sub" style="margin-top:6px">Least-cost path on the combined map, 3 m cells. ${report.note}</p>`;
  const p = report.profiles[profile], pb = p.curiosity_path_before_rover_rule;
  $('#check').innerHTML = `<div class="${pb['NO-GO'] <= 0.05 ? 'ok' : 'warn'}">${p.strictness_verdict}</div>
    <div class="sub">Curiosity's in-box path on our map: ${fmt(pb.GO)} GO, ${fmt(pb.CAUTION)} caution, ${fmt(pb['NO-GO'])} NO-GO.<br>
    Box: ${fmt(p.box.GO)} GO · ${fmt(p.box.CAUTION)} caution · ${fmt(p.box['NO-GO'])} NO-GO. ${fmt(p.connectivity.largest_component_share_of_passable)} of passable ground is one connected network; ${fmt(p.reachable_share_from_base)} of the box is reachable from the base.</div>`;
}

// ---------- live-sensor gates (SIMULATED values)
const ORDER = {GO: 0, CAUTION: 1, UNKNOWN: 2, 'NO-GO': 3};
const vals = Object.fromEntries(gates.gates.map(g => [g.id, g.num.default])); vals.age = gates.stale_after_hours.ui.default;
function gateState(g, v) { const n = g.num; return n.higher_is_worse ? (v >= n.nogo ? 'NO-GO' : v >= n.caution ? 'CAUTION' : 'GO') : (v < n.nogo ? 'NO-GO' : v < n.caution ? 'CAUTION' : 'GO'); }
function renderGates() {
  $('#gates').innerHTML = `<h1>Live sensors <span class="kv" style="font-weight:400">(simulated)</span></h1>
  <p class="sub">Radiation and weather are one value for the whole map, not a map layer. Worst gate wins. Thresholds are team ASSUMPTIONS; baselines are NASA data.</p>` +
  gates.gates.map(g => `<div class="leg"><div class="row"><span>${g.label}</span><span id="st_${g.id}"></span></div>
    <input type="range" data-g="${g.id}" min="${g.num.min}" max="${g.num.max}" step="${g.num.step}" value="${vals[g.id]}">
    <div class="row kv"><span id="v_${g.id}"></span><span>${g.num.unit_ui || g.unit}</span></div></div>`).join('') +
  `<div class="leg"><div class="row"><span>Age of newest reading</span><span id="st_age"></span></div>
    <input type="range" data-g="age" min="0" max="24" step="0.5" value="${vals.age}"><div class="row kv"><span id="v_age"></span><span>hours (stale after ${gates.stale_after_hours.value} h)</span></div></div>`;
  $('#gates').oninput = e => { const id = e.target.dataset.g; if (id) { vals[id] = +e.target.value; evalGates(); } };
  evalGates();
}
function evalGates() {
  let worst = 'GO';
  for (const g of gates.gates) { const s = gateState(g, vals[g.id]); $('#st_' + g.id).innerHTML = `<span class="chip ${s}">${s}</span>`; $('#v_' + g.id).textContent = vals[g.id]; if (ORDER[s] > ORDER[worst]) worst = s; }
  const stale = vals.age > gates.stale_after_hours.value; $('#st_age').innerHTML = `<span class="chip ${stale ? 'UNKNOWN' : 'GO'}">${stale ? 'STALE' : 'FRESH'}</span>`; $('#v_age').textContent = vals.age;
  if (stale && ORDER.UNKNOWN > ORDER[worst]) worst = 'UNKNOWN';
  const b = $('#banner'), msg = gates.combine.map_rule[worst];
  b.style.display = worst === 'GO' ? 'none' : 'block'; b.className = 'chip ' + worst; b.textContent = `LIVE GATE ${worst}: ${msg}`;
  mat.color.set(worst === 'NO-GO' ? 0xff5a5a : worst === 'UNKNOWN' ? 0x8a8a8a : 0xffffff);
}

// ---------- interaction
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const lerp = (a, b, t) => a + (b - a) * t, C = meta.corners_lonlat;
addEventListener('pointermove', e => {
  if (!mesh) return; mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(mesh)[0]; if (!hit) return;
  const x = hit.uv.x * WM, y = hit.uv.y * HM, L = current(), cls = classAt(L, x, y);
  if (!inSection(x, y)) return;
  const lon = lerp(C.SW[0], C.SE[0], x / WM), lat = lerp(C.SW[1], C.NW[1], y / HM);
  $('#readout').innerHTML = `<div class="row"><span class="kv">lon, lat</span><span>${lon.toFixed(5)}°E, ${lat.toFixed(5)}°</span></div>
    <div class="row"><span class="kv">elevation</span><span>${heightAt(x, y).toFixed(1)} m</span></div>
    <div class="row"><span class="kv">local x, y</span><span>${x.toFixed(0)} m E, ${y.toFixed(0)} m N</span></div>` +
    (cls ? `<div class="row"><span class="kv">${L.title.split(' (')[0]}</span><span class="chip ${cls}">${cls}</span></div>` : '');
});
renderer.domElement.addEventListener('click', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(poiMeshes)[0], box = $('#info');
  if (!hit) { box.style.display = 'none'; return; }
  const p = hit.object.userData; if (p.site) { siteCard(p.site); return; }
  box.style.display = 'block';
  box.innerHTML = p.eva ? `<h1>EVA stop ${p.eva.stop} (sol ${p.eva.sol}) <span class="chip ${{red: 'NO-GO', orange: 'CAUTION', green: 'GO'}[p.eva.team_class]}">${p.eva.team_class.toUpperCase()}</span></h1>
      <p class="sub">Team AI on a NASA Navcam image. Team colours: red if sand &gt; 30 % or big rock &gt; 2 %; orange if sand 10–30 % or AI certainty &lt; 0.75.</p>
      <div class="row"><span>AI certainty</span><span>${p.eva.certainty.toFixed(2)}</span></div>
      <div class="row"><span>sand</span><span>${(p.eva.sand * 100).toFixed(1)} %</span></div><div class="row"><span>big rock</span><span>${(p.eva.bigrock * 100).toFixed(1)} %</span></div>
      <div class="row"><span>soil</span><span>${(p.eva.soil * 100).toFixed(1)} %</span></div><div class="row"><span>bedrock</span><span>${(p.eva.bedrock * 100).toFixed(1)} %</span></div>`
    : `<h1>${p.name}</h1><p class="sub">sol ${p.sol} · ${p.category} · ${p.evidence}</p><p>${p.description || ''}</p><p class="kv">${p.science_value || ''}</p>
      ${p.source_url ? `<a href="${p.source_url}" target="_blank" rel="noopener">Source</a>` : ''}`;
});
$('#profile').onclick = e => { const p = e.target.dataset.p; if (!p) return; profile = p;
  document.querySelectorAll('#profile button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); showLayer(); buildOverlays(); renderRoutes(); };
['#tRoutes', '#tPath', '#tPois', '#tEva'].forEach(s => $(s).onchange = buildOverlays);
$('#tHQ').onchange = e => loadHeights(e.target.checked ? 'height_2m.bin' : 'height_4m.bin');
$('#exag').value = exag; $('#exv').textContent = exag + '×';
$('#exag').oninput = e => { exag = +e.target.value; $('#exv').textContent = exag + '×'; applyExag(); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); });

// click a panel title to fold it; on small screens the right-hand panels start folded
document.addEventListener('click', e => { const h = e.target.closest('.panel > h1:first-child'); if (h) h.parentElement.classList.toggle('min'); });
if (innerWidth < 820 || innerHeight < 700) ['#legend', '#gates'].forEach(s => $(s).classList.add('min'));
await loadHeights('height_4m.bin');
renderLayerMenu(); showLayer(); renderRoutes(); renderGates();
function setSectionOn(on) {
  secOn = on && !!SECT; renderer.clippingPlanes = secOn ? sectionPlanes(SECT) : []; buildOverlays();
  const q = new URLSearchParams(location.search); q.delete('profile');
  $('#secbar').style.display = SECT || secErr ? 'block' : 'none';
  $('#secbar').innerHTML = secErr ? `<span class="warn">Section not shown: ${secErr.replace(/[<>&]/g, '')}</span>` :
    `<b>Section</b>: ${SECT.label.replace(/[<>&]/g, '')}, ${Math.round(SECT.w)} × ${Math.round(SECT.h)} m (${(SEC.share(SEC.makeFrame(meta), SECT) * 100).toFixed(1)}% of the box)<br>
    <a href="#" id="secToggle">${secOn ? 'Show the whole map' : 'Show only the section'}</a> · <a href="../section/?${q.toString().replace(/[<>"]/g, '')}">Open as a map section</a>`;
  if (SECT) $('#secToggle').onclick = e => { e.preventDefault(); setSectionOn(!secOn); };
}
if (SECT || secErr) setSectionOn(secOn);
if (secOn) {                                                     // frame the section, keeping the opening view direction
  const c = P3(SECT.cx, SECT.cy, heightAt(SECT.cx, SECT.cy)), dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c); camera.position.copy(c).addScaledVector(dir, Math.max(SECT.w, SECT.h) * 1.3 + 150); controls.update();
}
renderPoiList();
$('#loading').remove();
renderer.setAnimationLoop(now => { stepFly(now); controls.update(); renderer.render(scene, camera); declutter(); labels.render(scene, camera); });
window.__viewer = {scene, camera, controls, manifest, report, focusSite, sites: ov.poi_sites};
</script>
</body>
</html>
